name: ChordFlow Java and media QA
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
jobs:
  java-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: bash scripts/build.sh
      - run: python3 tests/integration_queue_v2.py
      - run: java -Djava.awt.headless=true -cp build chordflow.Main render --seed 44 --seconds 2 --mode guitar --width 240 --height 426 --encoder x264 --out output
      - run: ffprobe -v error -show_entries stream=codec_name,codec_type,width,height -of json "$(find output -maxdepth 1 -name 'chordflow-44-guitar-240-*.mp4' -print -quit)"
  java-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure FFmpeg
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
          if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue)) { throw 'ffprobe missing in PATH' }
      - run: ./scripts/build.ps1
      - name: Verify Windows batch launcher and startup assets
        run: |
          cmd.exe /d /c "Build-ChordFlow.bat --no-pause"
          if ($LASTEXITCODE -ne 0) { throw 'Build-ChordFlow.bat failed' }
          foreach ($path in @('Start-ChordFlow.bat', 'Start-Controller.bat', 'Start-Worker.bat', 'scripts/wait-controller.ps1')) {
            if (-not (Test-Path $path)) { throw "Missing launcher: $path" }
          }
      - run: python tests/integration_queue_v2.py
      - name: Render Windows 2s smoke
        run: |
          java '-Djava.awt.headless=true' -cp build chordflow.Main render --seed 45 --seconds 2 --mode flow --width 240 --height 426 --encoder x264 --out output
          if ($LASTEXITCODE -ne 0) { throw 'Render failed' }
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height -of json (Get-ChildItem output -Filter 'chordflow-45-flow-240-*.mp4' | Select-Object -First 1).FullName
          if ($LASTEXITCODE -ne 0) { throw 'Media audit failed' }
